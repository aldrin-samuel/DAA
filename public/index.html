<!DOCTYPE html>
<html>
<head>
    <title>Linear Search</title>
</head>
<body>

    <h2>Linear Search</h2>

    <input type="number" id="number">
    <button onclick="searchNumber()">Search</button>

    <h3 id="result"></h3>

    <script>
        async function searchNumber() {

            const value =
                document.getElementById("number").value;

            const response =
                await fetch(`/search/${value}`);

            const data =
                await response.json();

            if (data.found) {
                document.getElementById("result").innerText =
                    `Found at index ${data.index}`;
            } else {
                document.getElementById("result").innerText =
                    data.message;
            }
        }
    </script>

</body>
</html>
