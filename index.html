<!DOCTYPE html>
<html>
<head>
    <title>Linear Search</title>
    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }
        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>

<h2>Linear Search </h2>

<input type="text" id="arrayInput" placeholder="Enter an Array (e.g. 1,2,3,4,5)">
<br>
<input type="number" id="target" placeholder="Enter number to search">
<br>

<button onclick="search()">Search</button>

<h3 id="result"></h3>

<script>
function search() {
    const arr = document.getElementById("arrayInput").value
        .split(",")
        .map(Number);

    const target = Number(document.getElementById("target").value);

    for (let i = 0; i < arr.length; i++) {
        if (arr[i] === target) {
            document.getElementById("result").innerText =
                `Found at index ${i}`;
            return;
        }
    }

    document.getElementById("result").innerText =
        "Not found";
}
</script>

</body>
</html>
